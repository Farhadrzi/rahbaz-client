# RahBaz Client desktop releases (Windows / Linux / macOS arm64 + x64).
#
# Automatic: push a version tag matching v*.*.* (example: v0.1.0)
# Manual: Actions → Desktop release → Run workflow
#
# This is separate from RahBaz Hub (Farhadrzi/rahbaz). The Client installer
# does NOT install Hub — users set Hub up themselves, then enter Hub URL + API key.
#
# Builds are unsigned unless you add optional signing secrets. Unsigned macOS /
# Windows packages will show Gatekeeper / SmartScreen warnings.

name: Desktop release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (example 0.1.0). Ignored for tag pushes."
        required: false
        default: "0.1.0"
      create_release:
        description: "Create/update a GitHub Release and upload artifacts"
        required: false
        default: true
        type: boolean

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  T3CODE_DESKTOP_UPDATE_REPOSITORY: Farhadrzi/rahbaz-client
  T3CODE_TELEMETRY_ENABLED: "false"
  T3CODE_TELEMETRY_CHANNEL: "dev"
  # Clerk/relay are unused for RahBaz Hub-only mode; keep empty placeholders so
  # upstream packaging scripts that read the env do not fail closed.
  T3CODE_CLERK_PUBLISHABLE_KEY: ""
  T3CODE_CLERK_JWT_TEMPLATE: ""
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ""
  T3CODE_RELAY_URL: ""

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.out.outputs.version }}
      tag: ${{ steps.out.outputs.tag }}
    steps:
      - id: out
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            ver="${tag#v}"
          else
            ver="${{ inputs.version }}"
            ver="${ver#v}"
            tag="v${ver}"
          fi
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Invalid version: $ver"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing RahBaz Client $tag"

  build:
    name: ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - label: Linux x64 AppImage
            runner: ubuntu-22.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: macOS Apple Silicon
            # macos-latest is Apple Silicon on GitHub-hosted runners.
            runner: macos-latest
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: macOS Intel
            # Build x64 on Apple Silicon runners via Rosetta (macos-13 capacity is scarce).
            runner: macos-latest
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Linux packaging dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 rpm fakeroot dpkg \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0

      - name: Ensure Rosetta for macOS Intel (x64) builds
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        shell: bash
        run: |
          if [[ "$(uname -m)" == "arm64" ]] && ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Align package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      - name: Build desktop artifact
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/rahbaz-out"
          mkdir -p "$out"
          node scripts/build-desktop-artifact.ts \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --verbose \
            --output-dir "$out"
          echo "OUT_DIR=$out" >> "$GITHUB_ENV"
          ls -la "$out"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rahbaz-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.OUT_DIR }}/**
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [version, build]
    if: github.event_name == 'push' || inputs.create_release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rahbaz-*
          merge-multiple: false

      - name: Flatten artifacts and merge macOS updater manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Collect installers/blockmaps; keep per-arch mac manifests aside for merging.
          shopt -s nullglob
          mac_manifests=()
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              latest-mac.yml)
                mac_manifests+=("$f")
                ;;
              builder-debug.yml)
                # Keep one copy for debugging; ignore duplicates by name.
                cp -n "$f" "release-assets/$base" || true
                ;;
              *)
                if [[ -e "release-assets/$base" ]]; then
                  echo "Duplicate asset name: $base" >&2
                  exit 1
                fi
                cp "$f" "release-assets/$base"
                ;;
            esac
          done < <(find dist -type f -print0)

          if [[ ${#mac_manifests[@]} -eq 0 ]]; then
            echo "No latest-mac.yml artifacts found" >&2
            exit 1
          fi

          printf '%s\n' "${mac_manifests[@]}" > /tmp/mac-manifests.txt
          python3 <<'PY'
          import pathlib, re

          paths = [pathlib.Path(line.strip()) for line in pathlib.Path("/tmp/mac-manifests.txt").read_text().splitlines() if line.strip()]

          def parse(path: pathlib.Path):
              text = path.read_text(encoding="utf-8")
              version = re.search(r"^version:\s*'?([^'\n]+)'?", text, re.M).group(1)
              release_date = re.search(r"^releaseDate:\s*'([^']+)'", text, re.M).group(1)
              files = []
              for m in re.finditer(
                  r"- url:\s*(\S+)\n\s+sha512:\s*(\S+)\n\s+size:\s*(\d+)",
                  text,
              ):
                  files.append((m.group(1), m.group(2), int(m.group(3))))
              if not files:
                  raise SystemExit(f"no files in {path}")
              return version, release_date, files

          versions, dates, files_by_url = set(), [], {}
          for path in paths:
              version, release_date, files = parse(path)
              versions.add(version)
              dates.append(release_date)
              for url, sha, size in files:
                  prev = files_by_url.get(url)
                  if prev and prev != (sha, size):
                      raise SystemExit(f"conflict for {url}")
                  files_by_url[url] = (sha, size)

          if len(versions) != 1:
              raise SystemExit(f"version mismatch: {versions}")
          version = next(iter(versions))
          release_date = max(dates)
          lines = [f"version: '{version}'", "files:"]
          for url, (sha, size) in files_by_url.items():
              lines += [f"  - url: {url}", f"    sha512: {sha}", f"    size: {size}"]
          lines.append(f"releaseDate: '{release_date}'")
          out = pathlib.Path("release-assets/latest-mac.yml")
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"merged {len(files_by_url)} mac updater entries -> {out}")
          PY

          echo "== release-assets =="
          find release-assets -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: RahBaz Client ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            RahBaz Client ${{ needs.version.outputs.tag }}

            ## Platforms
            - Windows x64 (NSIS)
            - Linux x64 (AppImage)
            - macOS Apple Silicon (arm64 DMG)
            - macOS Intel (x64 DMG)

            ## Setup
            1. Install and run **RahBaz Hub** yourself: https://github.com/Farhadrzi/rahbaz
            2. Install this Client (does **not** install Hub)
            3. Settings → RahBaz → Hub URL + gateway API key

            Builds are **unsigned** unless repository signing secrets are configured.
            macOS Gatekeeper / Windows SmartScreen warnings are expected for unsigned builds.

            Hub repository: https://github.com/Farhadrzi/rahbaz
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
